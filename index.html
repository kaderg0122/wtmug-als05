<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Kamera ile metin oku, seçtiğin dile çevir" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kamera Çevirmeni" />
  <title>Kamera Çevirmeni</title>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">📷</span>
      <div>
        <span class="brand-name">Kamera Çevirmeni</span>
        <span class="brand-sub">Yakala · Oku · Çevir</span>
      </div>
    </div>
    <span id="swIndicator" class="sw-indicator" title="Çevrimdışı hazır">✓</span>
  </header>

  <main class="app-main">

    <!-- Hedef Dil -->
    <section class="lang-section">
      <label for="targetLang" class="section-label">Hedef Dil</label>
      <select id="targetLang" class="lang-select">
        <option value="tr" selected>Türkçe</option>
        <option value="en">İngilizce</option>
        <option value="de">Almanca</option>
        <option value="fr">Fransızca</option>
        <option value="es">İspanyolca</option>
        <option value="it">İtalyanca</option>
        <option value="ru">Rusça</option>
        <option value="ar">Arapça</option>
        <option value="ja">Japonca</option>
        <option value="zh-CN">Çince (Basitleştirilmiş)</option>
        <option value="ko">Korece</option>
        <option value="pt">Portekizce</option>
        <option value="nl">Felemenkçe</option>
        <option value="pl">Lehçe</option>
        <option value="uk">Ukraynaca</option>
      </select>
      <p class="hint">Kaynak dil otomatik algılanır</p>
    </section>

    <!-- Kamera -->
    <section class="camera-section">
      <div class="camera-frame" id="cameraFrame">
        <video id="video" playsinline autoplay muted></video>
        <div class="camera-status" id="cameraStatus">Kamera kapalı</div>
        <canvas id="captureCanvas" hidden></canvas>
      </div>

      <div class="camera-controls">
        <button type="button" id="startCameraBtn" class="btn btn-primary">📷 Kamerayı Aç</button>
        <button type="button" id="captureBtn" class="btn btn-accent" disabled>📸 Yakala ve Çevir</button>
        <button type="button" id="stopCameraBtn" class="btn btn-secondary" disabled>Durdur</button>
      </div>
    </section>

    <!-- Galeriden Yükle -->
    <section class="upload-section">
      <label for="galleryInput" class="upload-label">
        🖼️ Galeriden Görsel Yükle
        <input type="file" id="galleryInput" accept="image/*" hidden />
      </label>
    </section>

    <!-- Klavye Girişi -->
    <section class="manual-section">
      <label for="manualInput" class="section-label">Klavyeyle Metin Gir</label>
      <form id="manualForm" class="manual-form">
        <input type="text" id="manualInput" placeholder="Çevrilecek metni yaz…" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Çevir</button>
      </form>
    </section>

    <!-- Mesajlar -->
    <p id="errorMsg" class="msg error-msg" hidden></p>
    <p id="infoMsg" class="msg info-msg" hidden></p>

    <!-- Yükleniyor -->
    <div id="loading" class="loading" hidden>
      <div class="spinner"></div>
      <p id="loadingText">İşleniyor…</p>
    </div>

    <!-- Sonuç -->
    <section id="resultSection" class="result-section" hidden>
      <div class="result-card">
        <div class="result-header">
          <span class="result-label">📖 Okunan Metin</span>
          <button type="button" id="copySourceBtn" class="icon-btn-small" title="Kopyala">📋</button>
        </div>
        <p id="sourceText" class="source-text"></p>
      </div>

      <div class="result-card result-card-translated">
        <div class="result-header">
          <span class="result-label">🌐 Çeviri (<span id="resultLangName">Türkçe</span>)</span>
          <button type="button" id="copyTranslatedBtn" class="icon-btn-small" title="Kopyala">📋</button>
        </div>
        <p id="translatedText" class="translated-text"></p>
      </div>
    </section>

    <p class="footer-note">
      OCR: <a href="https://tesseract.projectnaptha.com/" target="_blank" rel="noopener">Tesseract.js</a> ·
      Çeviri: <a href="https://mymemory.translated.net/" target="_blank" rel="noopener">MyMemory</a>
    </p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
